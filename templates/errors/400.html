{% extends "base.html" %}
{% block title %}Bad request{% endblock %}
{% block body %}
<div class="error-shell">
  <div>
    <div class="code">400</div>
    <h2>Bad request</h2>
    <p>Your session may have expired. Please refresh the page and try again.</p>
    <a class="btn btn-primary mt-3" href="{{ url_for('index') if is_authenticated else url_for('login') }}">Go home</a>
  </div>
</div>
{% endblock %}
