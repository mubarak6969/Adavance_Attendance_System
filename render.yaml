# Render Blueprint (https://render.com/docs/blueprint-spec).
#
# Optional convenience: use "New > Blueprint" on Render and point it at this
# repo to pre-fill the web service and env vars below, instead of
# configuring each field by hand. Everything here is safe to commit -- no
# secrets. SECRET_KEY is generated by Render itself; SUPER_ADMIN_PASSWORD
# and DATABASE_URL are intentionally left for you to type into Render's
# dashboard (sync: false means "prompt me, never store this in git").
#
# No persistent disk here on purpose: Render's free web service tier
# doesn't support one at all, and even on a paid plan this app doesn't need
# one -- students, attendance, captured face images, and the trained model
# all live in the Postgres database at DATABASE_URL instead (see README's
# "Deploying for free" section for why, and how to get a free Postgres
# database from Neon with no credit card).
#
# Verify field names against Render's current docs before relying on this --
# the Blueprint schema can change between when this was written and when
# you use it.

services:
  - type: web
    name: attendance-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers=1 --threads=8 --timeout=120
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SUPER_ADMIN_NAME
        value: Super Admin
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
